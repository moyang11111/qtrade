name: quality-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Python on Linux plus the current CI runtime on
          # Linux and Windows. Windows also executes the real CMD launcher test.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and declared test tools
        run: python -m pip install -e ".[test]"

      - name: Ruff repository syntax gate
        run: ruff check .

      - name: Ruff PR2 quality-surface gate
        run: ruff check tests/test_service_smoke.py tests/test_quality_gates.py --select E4,E7,E9,F

      - name: Run full pytest suite
        if: runner.os != 'Windows'
        run: python -m pytest -q

      # These tests intentionally exercise Windows child-process and scheduler
      # shutdown paths.  Keep them in their own interpreter so a console-signal
      # teardown cannot interrupt unrelated contract tests later in the suite.
      - name: Verify Windows update lifecycle tests in isolation
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          tests/test_daily_update_scheduler.py
          tests/test_manual_update_controls.py
          tests/test_manual_update_lifecycle.py

      - name: Run remaining Windows pytest suite
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          --ignore=tests/test_daily_update_scheduler.py
          --ignore=tests/test_manual_update_controls.py
          --ignore=tests/test_manual_update_lifecycle.py

      - name: Run deterministic CSV service smoke explicitly
        run: python -m pytest -q tests/test_service_smoke.py

      - name: Verify Windows CMD integration tests
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_pr1_local_latest.py

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
